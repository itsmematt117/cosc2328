<!DOCTYPE htmL>
    <html lang="en">
     <head>
        <meta charset="UTF-8">
        <title>HW6 - Interactive Product Calculator</title>
        <link rel="stylesheet" href="css/hw6.css">
        <script defer src="js/hw6-script.js"></script>      
     </head>

     <body>
        <header class="site-header">
            <h1>Product Order Calculator</h1>
            <main class="container">
                <form id="orderForm">
                    <fieldset>
                        <legend>Order Details</legend>
                            <label for="product">Products</label>
                            
                            <select id="product">
                                <option>Laptop</option>
                                <option>Tablet</option>
                                <option>Phone</option>
                                <option>Monitor</option>
                                <option></option>
                            </select>
                            <label for="quantity">Quantity </label>
                            <input type="number" id="quantity" min="0" max="10" value="1">

                            <label for="discountCode">Discount Code</label>
                            <input type="text" id="discountCode">
                            <button type="submit">Calculate Total</button>
 
                    </fieldset>
                    
                </form>

                <div class="results-hidden" id="results">
                    <p id="results-product">No product selected</p>
                    <p id="results-quantity">Quantity: $0</p>
                    <p id="results-subtotal">Sub total: $0</p>
                    <p id="results-discount">Discount: $0</p>
                    <p id="results-tax">Tax: $0</p>
                    <p id="results-total">Total: $0</p>
                </div>
            </main>

        </header>

        <footer class="site-footer">
            <p>Matthew Davis - COSC2328</p>
        </footer>
        <noscript><div class="alert">Enable JavaScript to view interactive content.</div></noscript>
     
        </body>
    </html>
